; SlowTimePitchFix settings
; Changes are re-read every time a save is loaded (no restart needed).

[General]
; 1 = fix gamepad up/down look becoming extremely slow while time is slowed (recommended)
; 0 = leave vanilla behaviour
bFixGamepadPitch=1

[SlowTime]
; Player speed while a Slow Time effect is active (Slow Time shout, time-slowing rings, ...).
;   -1  = do not change the game value (vanilla Skyrim.esm: 0.6)
;   1.0 = player moves at normal speed
;   0.6 / 0.8 / ... = custom (allowed range 0.05 - 1.0)
fPlayerSpeedMult=-1
